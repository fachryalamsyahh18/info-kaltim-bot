name: Jalankan info-kaltim-bot

on:
  schedule:
    # setiap 30 menit (UTC). Sesuaikan kalau mau lebih jarang/sering.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # biar bisa dijalankan manual dari tab Actions

permissions:
  contents: write  # perlu buat commit balik posted_links.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      - name: Commit state terbaru (posted_links.json)
        run: |
          git config user.name "info-kaltim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted_links.json
          git diff --staged --quiet || git commit -m "Update posted_links.json [skip ci]"
          git push
